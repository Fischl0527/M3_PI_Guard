   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'Times New Roman'" transform="translate(204.405081 34.105787)">Permission compiler</text>
    <text style="font-size: 10px; font-family: 'Times New Roman'" transform="translate(216.07305 44.57735)">Explicit policy</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10px; font-family: 'Times New Roman'" transform="translate(381.918965 34.115162)">Guard decision</text>
    <text style="font-size: 10px; font-family: 'Times New Roman'" transform="translate(362.973653 44.586725)">ALLOW / ASK / DENY</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'Times New Roman'" transform="translate(48.652916 111.456813)">Offline scoring</text>
    <text style="font-size: 10px; font-family: 'Times New Roman'" transform="translate(38.384947 121.947125)">Safety + completion</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'Times New Roman'" transform="translate(200.658987 111.475563)">Model action proposal</text>
    <text style="font-size: 10px; font-family: 'Times New Roman'" transform="translate(209.963675 121.947125)">Untrusted context</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'Times New Roman'" transform="translate(374.138497 111.475563)">Isolated simulation</text>
    <text style="font-size: 10px; font-family: 'Times New Roman'" transform="translate(373.039278 121.947125)">Execution evidence</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #ba642d" transform="translate(33.732283 70.259119)">Oracle-only</text>
    <text style="font-size: 9px; font-family: 'Times New Roman'; fill: #ba642d" transform="translate(33.732283 79.7004)">derived targets</text>
   </g>
  </g>
  <g id="text_8">
   <text style="font-size: 9px; font-family: 'Times New Roman'; text-anchor: start" x="9.92126" y="219.96" transform="rotate(-0 9.92126 219.96)">Raw evaluator fields stay outside model input; derived answer targets enter only the oracle Guard.</text>
  </g>
  <g id="text_9">
   <text style="font-size: 9px; font-family: 'Times New Roman'; text-anchor: start" x="9.92126" y="231.192" transform="rotate(-0 9.92126 231.192)">Permission, boundary rejection, execution, task completion and operational failure remain distinct.</text>
